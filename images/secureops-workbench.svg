  <text x="636" y="324" fill="#9db7df" font-family="Inter, Arial, sans-serif" font-size="21">Open cases</text>
  <text x="636" y="388" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">0</text>
  <text x="636" y="438" fill="#9db7df" font-family="Inter, Arial, sans-serif" font-size="21">0 closed</text>
  <rect x="748" y="304" width="52" height="52" rx="9" fill="#1d2a42"/>

  <text x="884" y="324" fill="#9db7df" font-family="Inter, Arial, sans-serif" font-size="21">MTTR</text>
  <text x="884" y="388" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">42m</text>
  <text x="884" y="438" fill="#9db7df" font-family="Inter, Arial, sans-serif" font-size="21">Mean response time</text>
  <rect x="996" y="304" width="52" height="52" rx="9" fill="#1d2a42"/>

  <text x="1132" y="324" fill="#9db7df" font-family="Inter, Arial, sans-serif" font-size="21">SLA compliance</text>
  <text x="1132" y="388" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">94%</text>
  <text x="1132" y="438" fill="#9db7df" font-family="Inter, Arial, sans-serif" font-size="21">0 breached</text>
  <rect x="1244" y="304" width="52" height="52" rx="9" fill="#1d2a42"/>

  <text x="1380" y="324" fill="#9db7df" font-family="Inter, Arial, sans-serif" font-size="21">Conversion</text>
  <text x="1380" y="388" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">0%</text>
  <text x="1380" y="438" fill="#9db7df" font-family="Inter, Arial, sans-serif" font-size="21">Alerts to cases</text>
  <rect x="1492" y="304" width="52" height="52" rx="9" fill="#1d2a42"/>

  <rect x="356" y="506" width="714" height="390" rx="12" fill="#111a2d" stroke="#263552"/>
  <text x="388" y="570" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">Alert Trend</text>
  <text x="984" y="568" fill="#9db7df" font-family="Inter, Arial, sans-serif" font-size="18">14 days</text>
  <line x1="470" y1="814" x2="1036" y2="814" stroke="#263552" stroke-width="2"/>
  <line x1="470" y1="714" x2="1036" y2="714" stroke="#263552" stroke-width="2" stroke-dasharray="6 7"/>
  <line x1="470" y1="614" x2="1036" y2="614" stroke="#263552" stroke-width="2" stroke-dasharray="6 7"/>
  <polyline points="486,786 548,742 610,758 672,680 734,700 796,626 858,646 920,586 1000,622" fill="none" stroke="url(#blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1100" y="506" width="476" height="390" rx="12" fill="#111a2d" stroke="#263552"/>
  <text x="1132" y="570" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">Severity Distribution</text>
  <circle cx="1248" cy="722" r="94" fill="none" stroke="#ff7a19" stroke-width="42"/>
  <circle cx="1248" cy="722" r="94" fill="none" stroke="#222c42" stroke-width="42" stroke-dasharray="112 520" transform="rotate(-90 1248 722)"/>
  <rect x="1388" y="628" width="76" height="32" rx="6" fill="#3b2319" stroke="#9f4b22"/>
  <text x="1402" y="650" fill="#ffb35c" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">High</text>
  <text x="1536" y="650" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">1</text>
</svg>
